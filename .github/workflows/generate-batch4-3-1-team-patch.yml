name: Generate Batch 4.3.1 Team Patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/generate-batch4-3-1-team-patch.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch repo
        uses: actions/checkout@v4
        with:
          path: patches
          fetch-depth: 0

      - name: Checkout exact TOS baseline
        uses: actions/checkout@v4
        with:
          repository: mohamedamouseo-a11y/TOS
          ref: fe18c6b47aac108a099297376c4a83f0add079fd
          path: tos
          fetch-depth: 0

      - name: Generate exact validated patch
        shell: bash
        run: |
          set -euo pipefail
          DIR='patches/TOS-ENGLISH-LOCALIZATION-BATCH4-3-1-TEAM-CORE-MEMBER-DETAILS-GIT-GENERATED'
          OUT="$DIR/TOS_ENGLISH_LOCALIZATION_BATCH4_3_1_TEAM.patch"
          python3 "$DIR/generate_batch4_3_1_team_v3.py" \
            "$DIR/generate_batch4_3_1_team.py" \
            "$PWD/tos" \
            "$PWD/$OUT"
          test -s "$OUT"
          test "$(sha256sum "$OUT" | awk '{print $1}')" = "fc0c0e2c644b2cfb465143347b2d19cc28af31148f4327bcc9156db2a458633b"
          git -C tos apply --numstat "$PWD/$OUT"
          git -C tos apply --check "$PWD/$OUT"

      - name: Commit generated patch and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          cd patches
          rm -f .github/workflows/generate-batch4-3-1-team-patch.yml
          git config user.name 'TOS Patch Generator'
          git config user.email 'tos-patch-generator@users.noreply.github.com'
          git add TOS-ENGLISH-LOCALIZATION-BATCH4-3-1-TEAM-CORE-MEMBER-DETAILS-GIT-GENERATED/TOS_ENGLISH_LOCALIZATION_BATCH4_3_1_TEAM.patch
          git add -u .github/workflows/generate-batch4-3-1-team-patch.yml
          git commit -m 'chore: add generated Batch 4.3.1 Team patch'
          git push origin main
